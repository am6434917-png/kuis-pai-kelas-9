"Malaikat yang meniup sangkakala pertama yang membinasakan seluruh makhluk adalah …",options:["Jibril","Mikail","Israfil","Izrail"],answer:2,explanation:"Malaikat Israfil bertugas meniup sangkakala. Tiupan pertama membinasakan makhluk, tiupan kedua membangkitkan mereka.",tag:"Hari Akhir"},{q:"Tempat abadi setelah hari perhitungan bagi orang beriman adalah …",options:["Surga","Dunia","Padang Mahsyar","Alam mimpi"],answer:0,explanation:"Setelah perhitungan dan melintasi shirath, orang beriman akan memasuki surga untuk selama-lamanya.",tag:"Hari Akhir"},{q:"Tempat berkumpulnya seluruh manusia setelah dibangkitkan dari kubur disebut …",options:["Mizan","Padang Mahsyar","Shirath","Barzakh"],answer:1,explanation:"Padang Mahsyar adalah tempat seluruh manusia dikumpulkan untuk menunggu perhitungan amal.",tag:"Hari Akhir"},{q:"Dampak positif mengimani Hari Akhir bagi orang yang beramal saleh adalah …",options:["Takut mencoba hal baru","Semakin semangat beramal saleh dan menjauhi maksiat","Hanya memikirkan dunia","Menunda semua ibadah"],answer:1,explanation:"Keyakinan bahwa amal akan dibalas membuat hati makin semangat berbuat baik dan berhati-hati dari maksiat.",tag:"Akhlak"},{q:"Surah yang menggambarkan guncangan bumi dan manusia seperti anai-anai yang beterbangan adalah …",options:["Q.S. Al-Fatihah","Q.S. Al-Ikhlas","Q.S. Al-Qari’ah","Q.S. An-Nas"],answer:2,explanation:"Q.S. Al-Qari’ah menggambarkan hari kiamat yang mengguncangkan dan manusia yang beterbangan seperti anai-anai.",tag:"Al-Qur’an"},{q:"Yang BUKAN tanda besar kiamat (kubra) adalah …",options:["Kemunculan Dajjal","Turunnya Nabi Isa","Banyaknya gedung tinggi","Kemunculan Ya’juj dan Ma’juj"],answer:2,explanation:"Banyaknya gedung tinggi termasuk tanda kecil. Dajjal, turunnya Nabi Isa, dan Ya’juj Ma’juj adalah tanda besar.",tag:"Tanda Kiamat"},{q:"Kemunculan Ya’juj dan Ma’juj termasuk …",options:["Tanda kecil kiamat","Tanda besar kiamat (kubra)","Tanda kiamat sudah selesai","Peristiwa biasa di dunia"],answer:1,exp
